name: Deploy dashboard to Pages

# Publishes the static dashboard. It assembles the Pages artifact from two
# places so the frontend and the data it fetches end up same-origin:
#   web/      -> site root   (the dashboard; swap for a React build later)
#   data/     -> /data       (per-game JSON written by the pipelines)
# Pages source must be set to "GitHub Actions" (Settings > Pages > Build and
# deployment > Source: GitHub Actions) for this to deploy.

on:
  push:
    branches: [main]
    # Only redeploy when the site or the data actually changes.
    paths:
      - "web/**"
      - "data/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch: {}
  # Data commits from the refresh workflow use GITHUB_TOKEN, which does not fire
  # the push trigger above (loop prevention), so redeploy when it finishes.
  workflow_run:
    workflows: ["Refresh NFL data"]
    types: [completed]

# Allow one concurrent deployment; let an in-progress run finish.
concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # For a workflow_run trigger, only deploy if the refresh actually succeeded;
    # push / manual dispatch always proceed.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build dashboard
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Assemble site (build output + data)
        run: |
          mkdir -p _site
          cp -r web/dist/. _site/
          mkdir -p _site/data
          cp -r data/. _site/data/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
